<footer class="px-6 py-10 bg-[var(--bg-main)] text-[var(--text-main)]
        transition-colors duration-500 border-t border-[var(--border-soft)]">
  <div
    class="max-w-7xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-mono text-[var(--text-soft)]">
    <p>© {{ currentYear }} — <span class="text-[var(--primary-text)]">Hedi Basly</span></p>

    <ul class="flex items-center gap-3">
      @for (link of socialLinks; track link.name) {
      <li>
        <a [href]="link.url" target="_blank" rel="noopener noreferrer"
          class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-[var(--border-soft)] transition-colors hover:border-[var(--border-strong)] hover:text-[var(--text-main)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--primary)]">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="link.icon" />
          </svg>
          <span class="sr-only">{{ link.name }} (s'ouvre dans un nouvel onglet)</span>
        </a>
      </li>
      }
    </ul>
  </div>
</footer>
