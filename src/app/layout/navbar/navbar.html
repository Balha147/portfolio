<header class="fixed top-0 inset-x-0 z-50 pt-4 px-4 transition-all duration-300">

  <nav class="relative max-w-6xl mx-auto px-3 py-2 rounded-2xl transition-all duration-500 overflow-hidden
              bg-[var(--navbar-bg)] backdrop-blur-2xl border border-[var(--border-soft)] shadow-[var(--shadow-navbar)]
              md:transition-all md:duration-500" [class.md:bg-transparent]="!scrolled() && !menuOpen()"
    [class.md:border-transparent]="!scrolled() && !menuOpen()" [class.md:shadow-none]="!scrolled() && !menuOpen()"
    aria-label="Navigation principale">

    <!-- Barre de progression du scroll -->
    <div class="absolute top-0 inset-x-0 h-[2px] bg-transparent overflow-hidden pointer-events-none">
      <div
        class="h-full bg-gradient-to-r from-[#ff5520] via-[#e85aa9] to-[#7657ff] transition-all duration-150 ease-out"
        [style.width.%]="scrollProgress()">
      </div>
    </div>

    <div class="flex items-center justify-between h-12 md:h-14">

      <!-- Branding / Switch Thème Mobile -->
      <div class="flex items-center">
        <a href="#hero" class="hidden md:flex items-center gap-3 group" aria-label="Retour à l'accueil">
          <span class="text-lg font-black tracking-[-0.06em] text-[var(--text-main)]">
            MHB<span class="text-[var(--primary)] transition-colors duration-300">.</span>
          </span>
          <span class="h-4 w-px bg-[var(--border-soft)]"></span>
          <span class="text-[9px] font-bold uppercase tracking-[0.22em] text-[var(--text-muted)]">
            HEDI BASLY
          </span>
        </a>

        <div class="md:hidden">
          <app-switch [theme]="theme()" (themeChanged)="onToggleTheme()"></app-switch>
        </div>
      </div>

      <!-- Navigation Desktop -->
      <div class="flex items-center justify-center">
        <a href="#hero" (click)="closeMenu()" class="md:hidden flex items-center" aria-label="Retour à l'accueil">
          <span class="text-lg font-black tracking-[-0.06em] text-[var(--text-main)]">
            MHB<span class="text-[var(--primary)]">.</span>
          </span>
        </a>

        <ul
          class="hidden md:flex items-center gap-1 p-1 rounded-full border border-[var(--border-soft)] bg-[var(--bg-main)]/30 backdrop-blur-md">
          @for (item of navItems; track item.path) {
          <li>
            <a [href]="item.path"
              class="relative block px-3.5 py-2 rounded-full text-[10px] font-bold uppercase tracking-[0.14em] text-[var(--text-soft)] transition-all duration-300 group">
              <span
                class="absolute inset-0 rounded-full bg-[var(--primary)]/[0.08] scale-75 opacity-0 group-hover:scale-100 group-hover:opacity-100 transition-all duration-300"></span>
              <span class="relative group-hover:text-[var(--text-main)] transition-colors duration-300">
                {{ item.label }}
              </span>
            </a>
          </li>
          }
        </ul>
      </div>

      <!-- Actions : Switch Thème Desktop & Bouton Hamburger Mobile -->
      <div class="flex items-center gap-3">
        <div class="hidden md:block">
          <app-switch [theme]="theme()" (themeChanged)="onToggleTheme()"></app-switch>
        </div>

        <button type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()"
          aria-label="Ouvrir le menu de navigation"
          class="md:hidden relative w-10 h-10 flex flex-col items-center justify-center gap-1.5 rounded-xl border border-[var(--border-soft)] bg-[var(--bg-card)] transition-all duration-300 hover:border-[var(--border-strong)]">
          <span class="sr-only">Menu</span>
          <span class="w-5 h-px bg-[var(--text-main)] transition-all duration-300" [class.rotate-45]="menuOpen()"
            [class.translate-y-2]="menuOpen()"></span>
          <span class="w-5 h-px bg-[var(--text-main)] transition-all duration-300"
            [class.opacity-0]="menuOpen()"></span>
          <span class="w-5 h-px bg-[var(--text-main)] transition-all duration-300" [class.-rotate-45]="menuOpen()"
            [class.-translate-y-2]="menuOpen()"></span>
        </button>
      </div>

    </div>

    <!-- Navigation Mobile (Grille déroulante) -->
    @if (menuOpen()) {
    <div
      class="md:hidden mt-2 pt-2 border-t border-[var(--border-soft)] animate-in slide-in-from-top-2 fade-in duration-300">
      <div class="grid grid-cols-2 gap-2 py-2">
        @for (item of navItems; track item.path) {
        <a (click)="closeMenu()" [href]="item.path"
          class="flex items-center justify-center min-h-12 rounded-xl border border-[var(--border-soft)] bg-[var(--bg-card)]/70 text-[10px] font-black uppercase tracking-[0.12em] text-[var(--text-soft)] hover:text-[var(--text-main)] hover:border-[var(--border-strong)] transition-all duration-300">
          {{ item.label }}
        </a>
        }
      </div>
    </div>
    }

  </nav>
</header>
