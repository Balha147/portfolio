<header class="fixed top-0 inset-x-0 z-50 pt-4 px-4 transition-all duration-300">

  <nav class="relative max-w-6xl mx-auto px-3 py-2 rounded-2xl transition-all duration-500
              bg-[var(--navbar-bg)] backdrop-blur-2xl border border-[var(--border-soft)] shadow-[var(--shadow-navbar)]
              md:transition-all md:duration-500" [class.md:bg-transparent]="!scrolled() && !menuOpen()"
    [class.md:border-transparent]="!scrolled() && !menuOpen()" [class.md:shadow-none]="!scrolled() && !menuOpen()"
    aria-label="Navigation principale">

    <div class="absolute top-0 inset-x-0 h-[2px] rounded-t-2xl bg-transparent overflow-hidden pointer-events-none">
      <div
        class="h-full bg-gradient-to-r from-[#ff5520] via-[#e85aa9] to-[#7657ff] transition-all duration-150 ease-out"
        [style.width.%]="scrollProgress()">
      </div>
    </div>

    <div class="grid grid-cols-[1fr_auto_1fr] items-center h-12 md:h-14">

      <div class="flex items-center justify-self-start">
        <a href="#hero" class="hidden md:flex items-center gap-3 group">
          <span class="text-lg font-black tracking-[-0.06em] text-[var(--text-main)]">
            MHB<span class="text-[var(--primary-text)] transition-colors duration-300">.</span>
          </span>
          <span class="h-4 w-px bg-[var(--border-soft)]"></span>
          <span class="text-[9px] font-bold uppercase tracking-[0.22em] text-[var(--text-muted)]">
            HEDI BASLY
          </span>
          <span class="sr-only"> — retour à l'accueil</span>
        </a>

        <div class="md:hidden">
          <app-switch [theme]="theme()" (themeChanged)="onToggleTheme()"></app-switch>
        </div>
      </div>

      <div class="flex items-center justify-center">
        <a href="#hero" (click)="closeMenu()" class="md:hidden flex items-center">
          <span class="text-lg font-black tracking-[-0.06em] text-[var(--text-main)]">
            MHB<span class="text-[var(--primary-text)]">.</span>
          </span>
          <span class="sr-only"> — retour à l'accueil</span>
        </a>

        <ul appDock
          class="hidden md:flex items-center gap-2 p-1.5 rounded-full border border-[var(--border-soft)] bg-[var(--bg-main)]/30 backdrop-blur-md">

          @for (item of navItems; track item.path; let i = $index) {
          <li class="group relative">

            <a [href]="item.path" [attr.aria-label]="item.label"
              [attr.aria-current]="isActive(item.path) ? 'location' : null" class="relative flex size-10 items-center justify-center rounded-full outline-none
                     transition-[background-color,color] duration-200 ease-out motion-reduce:transition-none
                     focus-visible:ring-2 focus-visible:ring-[var(--primary)]" [class]="isActive(item.path)
                ? 'bg-[var(--primary)]/[0.12] text-[var(--primary-text)]'
                : 'text-[var(--text-soft)] hover:bg-[var(--primary)]/[0.08] hover:text-[var(--text-main)]'">

              <app-nav-icon [appDockItem]="i" [path]="item.icon"
                class="size-5 will-change-transform transition-transform duration-200 ease-out motion-reduce:transition-none" />

              @if (isActive(item.path)) {
              <span
                class="absolute bottom-[3px] left-1/2 size-1 -translate-x-1/2 rounded-full bg-[var(--primary)]"></span>
              }
            </a>

            <span aria-hidden="true" class="pointer-events-none absolute left-1/2 top-full z-10 mt-6 -translate-x-1/2 translate-y-1 whitespace-nowrap
                     rounded-lg border border-[var(--border-soft)] bg-[var(--bg-card)] px-2.5 py-1.5 backdrop-blur-xl
                     text-[10px] font-bold uppercase tracking-[0.14em] text-[var(--text-main)] shadow-[var(--shadow-navbar)]
                     opacity-0 transition duration-200 motion-reduce:transition-none
                     group-hover:translate-y-0 group-hover:opacity-100
                     group-has-[:focus-visible]:translate-y-0 group-has-[:focus-visible]:opacity-100">
              {{ item.label }}
            </span>
          </li>
          }
        </ul>
      </div>

      <div class="flex items-center gap-3 justify-self-end">
        <div class="hidden md:block">
          <app-switch [theme]="theme()" (themeChanged)="onToggleTheme()"></app-switch>
        </div>

        <button type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu"
          [attr.aria-label]="menuOpen() ? 'Fermer le menu de navigation' : 'Ouvrir le menu de navigation'"
          class="md:hidden relative w-10 h-10 flex flex-col items-center justify-center gap-1.5 rounded-xl border border-[var(--border-soft)] bg-[var(--bg-card)] transition-all duration-300 hover:border-[var(--border-strong)]">
          <span class="sr-only">Menu</span>
          <span class="w-5 h-px bg-[var(--text-main)] transition-all duration-300" [class.rotate-45]="menuOpen()"
            [class.translate-y-2]="menuOpen()"></span>
          <span class="w-5 h-px bg-[var(--text-main)] transition-all duration-300"
            [class.opacity-0]="menuOpen()"></span>
          <span class="w-5 h-px bg-[var(--text-main)] transition-all duration-300" [class.-rotate-45]="menuOpen()"
            [class.-translate-y-2]="menuOpen()"></span>
        </button>
      </div>

    </div>

    @if (menuOpen()) {
    <ul id="mobile-menu" class="md:hidden mt-2 pt-2 pb-1 border-t border-[var(--border-soft)]">
      @for (item of navItems; track item.path; let i = $index) {
      <li class="animate-in fade-in slide-in-from-top-2 duration-300 fill-mode-both"
        [style.animation-delay.ms]="i * 40">
        <a [href]="item.path" (click)="closeMenu()" [attr.aria-current]="isActive(item.path) ? 'location' : null"
          class="flex min-h-12 items-center gap-3 rounded-xl px-3 text-[11px] font-black uppercase tracking-[0.12em] transition-colors duration-300"
          [class]="isActive(item.path)
            ? 'bg-[var(--primary)]/[0.12] text-[var(--primary-text)]'
            : 'text-[var(--text-soft)] hover:bg-[var(--primary)]/[0.08] hover:text-[var(--text-main)]'">

          <app-nav-icon [path]="item.icon" class="size-5" />

          {{ item.label }}
        </a>
      </li>
      }
    </ul>
    }

  </nav>
</header>
