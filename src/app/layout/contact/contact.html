<section id="contact" class="relative py-12 lg:py-20 scroll-mt-20">
  <header class="text-center mb-24 relative z-10">
    <h2 class="text-5xl lg:text-7xl font-black tracking-tighter text-[var(--text-main)]">
      Donnons vie à vos idées
    </h2>
    <div class="mt-6 mx-auto h-1.5 w-24 rounded-full bg-[var(--btn-gradient)]"></div>
  </header>

  <div class="max-w-7xl mx-auto px-6">
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 lg:gap-6">

      <!-- Bloc Formulaire -->
      <div
        class="md:col-span-2 md:row-span-2 bg-[var(--bg-card)] border border-[var(--border-soft)] rounded-[2.5rem] p-8 lg:p-10 shadow-2xl relative overflow-hidden order-1">
        <form class="space-y-5 relative z-10 flex flex-col h-full">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input type="text" placeholder="Nom"
              class="w-full bg-[var(--bg-main)]/50 border border-[var(--border-soft)] rounded-2xl px-5 py-4 text-[var(--text-main)] focus:border-[var(--primary)] outline-none transition-all placeholder:text-[var(--text-soft)]/50" />
            <input type="email" placeholder="Email"
              class="w-full bg-[var(--bg-main)]/50 border border-[var(--border-soft)] rounded-2xl px-5 py-4 text-[var(--text-main)] focus:border-[var(--primary)] outline-none transition-all placeholder:text-[var(--text-soft)]/50" />
          </div>
          <textarea rows="5" placeholder="Parlez-moi de votre projet..."
            class="w-full bg-[var(--bg-main)]/50 border border-[var(--border-soft)] rounded-2xl px-5 py-4 text-[var(--text-main)] focus:border-[var(--primary)] outline-none transition-all resize-none placeholder:text-[var(--text-soft)]/50"></textarea>

          <button type="submit"
            class="w-full cursor-pointer flex items-center justify-center gap-2 hover:gap-4 rounded-full px-8 py-4 text-center text-sm font-bold uppercase tracking-wider text-white transition-all duration-300 shadow-[0_10px_20px_-5px_var(--btn-shadow)] hover:shadow-[0_15px_30px_-5px_var(--btn-shadow)] group"
            style="background: var(--btn-gradient)">
            <span>Envoyer le message</span>
            <!-- SVG Paper Plane -->
            <svg class="w-4 h-4 fill-current transition-transform duration-300 group-hover:translate-x-1"
              viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </button>
        </form>
      </div>

      <!-- Bloc Email -->
      <a [href]="'mailto:' + person.email"
        class="bg-[var(--primary)] rounded-[2.5rem] p-8 flex flex-col justify-between text-white shadow-xl group cursor-pointer hover:scale-[1.02] transition-transform order-2 min-h-[160px]">
        <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-xl">
          <!-- SVG Envelope -->
          <svg class="w-6 h-6 fill-current text-white" viewBox="0 0 24 24">
            <path
              d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
          </svg>
        </div>
        <div>
          <p class="text-xs font-bold uppercase opacity-70 mb-1">Email</p>
          <p class="text-sm font-bold break-all text-white">{{ person.email }}</p>
        </div>
      </a>

      <!-- Bloc Téléphone -->
      <a [href]="'tel:' + person.tel"
        class="bg-[var(--bg-card)] border border-[var(--border-soft)] rounded-[2.5rem] p-8 flex flex-col items-center justify-center text-center gap-3 order-3 group hover:border-[var(--primary)] transition-all">
        <div class="relative">
          <div class="absolute inset-0 rounded-full bg-[var(--primary)] opacity-20 animate-ping"></div>
          <div
            class="relative w-12 h-12 rounded-full bg-[var(--primary)]/10 text-[var(--primary)] flex items-center justify-center shadow-sm">
            <!-- SVG Phone -->
            <svg class="w-5 h-5 fill-current animate-bounce" viewBox="0 0 24 24">
              <path
                d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
            </svg>
          </div>
        </div>
        <p class="text-sm font-black text-[var(--text-main)]">{{ person.tel }}</p>
      </a>

      <!-- Bloc Map Localisation -->
      <div
        class="relative bg-[var(--bg-card)] border border-[var(--border-soft)] rounded-[2.5rem] overflow-hidden order-4 group h-[200px] md:h-auto min-h-[180px]">
        <iframe
          class="absolute inset-0 w-full h-full grayscale hover:grayscale-0 transition-all duration-700 opacity-50 group-hover:opacity-100"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10509.32410657929!2d2.2530122!3d48.8014244!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e671230fecf221%3A0x400b3281a08b3e40!2sClamart!5e0!3m2!1sfr!2sfr!4v1710000000000!5m2!1sfr!2sfr"
          style="border: 0" allowfullscreen="" loading="lazy">
        </iframe>
        <div
          class="absolute bottom-4 left-4 right-4 bg-white/80 dark:bg-black/80 backdrop-blur-md p-3 rounded-2xl border border-white/20 pointer-events-none">
          <p class="text-[10px] font-black uppercase tracking-widest text-[var(--primary)]">
            Localisation
          </p>
          <p class="text-xs font-bold text-[var(--text-main)]">{{ person.adress }}</p>
        </div>
      </div>

      <!-- Bloc Réseaux Sociaux -->
      <div
        class="bg-[var(--bg-card)] border border-[var(--border-soft)] rounded-[2.5rem] p-8 flex flex-col justify-between order-5 group hover:border-[var(--primary)] transition-all">
        <div class="flex justify-around items-center h-full gap-4">
          <!-- Link GitHub -->
          <a [href]="person.github" target="_blank" rel="noopener noreferrer"
            class="w-12 h-12 rounded-xl bg-[var(--bg-main)] flex items-center justify-center text-[var(--text-soft)] hover:text-[var(--primary)] hover:scale-110 transition-all shadow-sm">
            <!-- SVG GitHub -->
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
            </svg>
          </a>

          <!-- Link LinkedIn -->
          <a [href]="person.linkedIn" target="_blank" rel="noopener noreferrer"
            class="w-12 h-12 rounded-xl bg-[var(--bg-main)] flex items-center justify-center text-[var(--text-soft)] hover:text-[#0077b5] hover:scale-110 transition-all shadow-sm">
            <!-- SVG LinkedIn -->
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path
                d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
            </svg>
          </a>
        </div>
        <p class="text-[10px] font-black text-center text-[var(--text-soft)] uppercase mt-4">
          Connectons-nous
        </p>
      </div>

    </div>
  </div>
</section>
