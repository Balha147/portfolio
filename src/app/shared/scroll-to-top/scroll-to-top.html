<button (click)="scrollToTop()" type="button" aria-label="Retourner en haut de la page"
  [class.opacity-100]="isVisible()" [class.pointer-events-auto]="isVisible()" [class.translate-y-0]="isVisible()"
  [class.opacity-0]="!isVisible()" [class.pointer-events-none]="!isVisible()" [class.translate-y-4]="!isVisible()"
  class="fixed bottom-6 right-6 z-50 p-3 rounded-2xl
               border border-[var(--border-soft)] bg-[var(--bg-card)]/80 backdrop-blur-md
               text-[var(--text-main)] shadow-lg shadow-black/5
               hover:border-[var(--border-strong)] hover:text-[var(--primary-text)] hover:-translate-y-1
               transition-all duration-300 ease-out group">

  <svg class="w-5 h-5 transition-transform duration-300 group-hover:-translate-y-0.5" fill="none" viewBox="0 0 24 24"
    stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
  </svg>

</button>
