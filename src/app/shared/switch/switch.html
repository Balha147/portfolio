<div class="flex items-center">
  <label class="relative inline-flex items-center cursor-pointer select-none group">
    <input type="checkbox" class="peer sr-only" [checked]="theme() === 'dark'" (change)="onToggle()"
      [attr.aria-label]="theme() === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre'" />

    <div class="
        relative w-11 h-7 rounded-full
        border border-[var(--border-soft)]
        bg-[var(--bg-elevated)]
        transition-all duration-300
        group-hover:border-[var(--border-strong)]
        group-hover:bg-[var(--bg-card-hover)]
        peer-focus-visible:ring-2 peer-focus-visible:ring-[var(--primary)]
        peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-[var(--bg-main)]
      ">
      <span class="
          absolute inset-0 rounded-full
          bg-[var(--primary)] opacity-0
          transition-opacity duration-300
          peer-checked:opacity-[0.08]
        "></span>
    </div>

    <div class="
        absolute top-1 left-1 w-5 h-5 rounded-full
        flex items-center justify-center
        bg-[var(--primary)] text-white
        shadow-[0_2px_8px_rgba(0,0,0,0.15)]
        transition-all duration-300 ease-[cubic-bezier(0.34,1.56,0.64,1)]
        peer-checked:translate-x-4 peer-checked:bg-[var(--text-main)]
      ">

      <svg class="
          absolute w-3 h-3 text-white
          transition-all duration-300
          opacity-100 rotate-0 scale-100
          peer-checked:opacity-0 peer-checked:rotate-90 peer-checked:scale-0
        " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path
          d="M12 2v2 m0 16v2 M4.93 4.93l1.41 1.41 m11.32 11.32l1.41 1.41 M2 12h2 m16 0h2 M6.34 17.66l-1.41 1.41 M19.07 4.93l-1.41 1.41">
        </path>
      </svg>

      <svg class="
          absolute w-3 h-3 text-[var(--bg-main)]
          transition-all duration-300
          opacity-0 -rotate-90 scale-0
          peer-checked:opacity-100 peer-checked:rotate-0 peer-checked:scale-100
        " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </div>

    <div class="absolute inset-0 flex items-center justify-between px-2.5 pointer-events-none">
      <span class="w-0.5 h-0.5 rounded-full bg-[var(--text-muted)] opacity-40"></span>
      <span class="w-0.5 h-0.5 rounded-full bg-[var(--text-muted)] opacity-40"></span>
    </div>
  </label>
</div>
