<section id="skills" class="relative py-24 md:py-32 px-6 overflow-hidden
         bg-[var(--bg-main)] text-[var(--text-main)]
         transition-colors duration-500 border-t border-[var(--border-soft)]">

    <div class="absolute inset-0 pointer-events-none opacity-60
             bg-[radial-gradient(var(--grid-color)_1px,transparent_1px)]
             [background-size:24px_24px]
             [mask-image:radial-gradient(ellipse_60%_60%_at_50%_50%,#000_40%,transparent_100%)]">
    </div>

    <div class="absolute top-1/2 left-10 -translate-y-1/2
             w-[400px] h-[400px] rounded-full
             bg-[var(--primary)] opacity-[0.03] dark:opacity-[0.025]
             blur-[120px] pointer-events-none">
    </div>

    <div class="max-w-7xl mx-auto w-full relative z-10">

        <div class="flex items-center gap-3 mb-8">
            <span class="text-xs font-mono uppercase tracking-[0.25em] text-[var(--primary)]">04.</span>
            <span class="text-xs font-mono uppercase tracking-[0.25em] text-[var(--text-soft)]">Stack &
                Compétences</span>
            <div class="h-px bg-[var(--border-soft)] flex-1 max-w-[100px]"></div>
        </div>

        <div class="mb-16">
            <h2 class="text-4xl sm:text-5xl lg:text-6xl font-black tracking-tighter uppercase leading-none">
                Stack Technique &<br />
                <span class="bg-gradient-to-r from-[#ff5520] via-[#e85aa9] to-[#7657ff] bg-clip-text text-transparent">
                    Expertises
                </span>
            </h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            @for (skill of skillsConfig; track skill.title) {
            <div
                class="group relative p-6 md:p-8 rounded-2xl border border-[var(--border-soft)] bg-[var(--bg-card)]/50 backdrop-blur-sm transition-all duration-300 hover:border-[var(--border-strong)] flex flex-col justify-between">

                <div>
                    <div class="flex items-center justify-between gap-2 mb-4 pb-3 border-b border-[var(--border-soft)]">
                        <h3
                            class="text-xl font-black tracking-tight text-[var(--text-main)] group-hover:text-[var(--primary)] transition-colors">
                            {{ skill.title }}
                        </h3>
                        <span
                            class="px-2.5 py-1 rounded-md text-[10px] font-mono uppercase tracking-wider bg-[var(--primary)]/10 text-[var(--primary)] border border-[var(--primary)]/20 whitespace-nowrap">
                            {{ skill.badge }}
                        </span>
                    </div>

                    <p class="text-xs md:text-sm text-[var(--text-soft)] font-light leading-relaxed mb-6">
                        {{ skill.description }}
                    </p>

                    <div class="flex flex-wrap gap-2">
                        @for (skill of skill.skills; track skill.name) {
                        <span [class.border-[var(--primary)]/40]="skill.highlight"
                            [class.bg-[var(--primary)]/10]="skill.highlight"
                            [class.text-[var(--primary)]]="skill.highlight"
                            [class.border-[var(--border-soft)]]="!skill.highlight"
                            [class.bg-[var(--bg-main)]]="!skill.highlight"
                            [class.text-[var(--text-soft)]]="!skill.highlight"
                            class="px-3 py-1.5 rounded-xl border text-xs font-mono transition-all duration-200 hover:scale-105">
                            {{ skill.name }}
                        </span>
                        }
                    </div>
                </div>

            </div>
            }

        </div>

    </div>
</section>
